# =============================================================================
# DOCKER COMPOSE - MandeMarket PRODUCTION
# =============================================================================
# Configuration indépendante pour l'environnement de production
# Utilisation: 
#   - Démarrer: docker compose -f docker-compose.prod.yml --project-name mandemarket-prod --env-file .env.production up -d
#   - Arrêter: docker compose -f docker-compose.prod.yml --project-name mandemarket-prod down
#   - Logs: docker compose -f docker-compose.prod.yml --project-name mandemarket-prod logs -f
#   - Rebuild: docker compose -f docker-compose.prod.yml --project-name mandemarket-prod up -d --build
# =============================================================================

services:
  # ===========================================================================
  # MandeMarket Backend
  # ===========================================================================
  mandemarket-backend: &backend-service
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandemarket-backend
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=${TRUST_PROXY:?Set the trusted proxy IP/CIDR}
      - PORT=4002
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${MANDEMARKET_DB_USER}:${MANDEMARKET_DB_PASSWORD}@mandemarket-db:5432/${MANDEMARKET_DB_NAME}
      - REDIS_URL=redis://:${MANDEMARKET_REDIS_PASSWORD}@mandemarket-redis:6379
      - REDIS_PASSWORD=${MANDEMARKET_REDIS_PASSWORD}
      - JWT_SECRET=${MANDEMARKET_JWT_SECRET}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - CORS_ORIGIN=${MANDEMARKET_CORS_ORIGIN}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=/app/logs/app.log
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - METRICS_TOKEN=${METRICS_TOKEN:?Set a strong METRICS_TOKEN}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - CINETPAY_SITE_ID=${CINETPAY_SITE_ID:-}
      - CINETPAY_API_KEY=${CINETPAY_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - mandemarket_backend_uploads:/app/uploads
      - mandemarket_backend_logs:/app/logs
    depends_on:
      mandemarket-db:
        condition: service_healthy
      mandemarket-redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/tmp:rw,noexec,nosuid,size=32m,uid=1001,gid=1001,mode=0770
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health/ready"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - traefik_network
      - mandemarket_internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.mandemarket-api.rule=Host(`apimandemarket.soubadigital.com`)
      - traefik.http.routers.mandemarket-api.entrypoints=websecure
      - traefik.http.routers.mandemarket-api.tls=true
      - traefik.http.routers.mandemarket-api.tls.certresolver=mytlschallenge
      - traefik.http.services.mandemarket-api.loadbalancer.server.port=4002

  mandemarket-worker:
    <<: *backend-service
    container_name: mandemarket-worker
    command: ["node", "scripts/worker.js"]
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');process.exit(Date.now()-Number(f.readFileSync('/app/tmp/worker-heartbeat','utf8'))<300000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

  # ===========================================================================
  # MandeMarket Frontend
  # ===========================================================================
  mandemarket-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://apimandemarket.soubadigital.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mandemarket.soubadigital.com}
    container_name: mandemarket-frontend
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://apimandemarket.soubadigital.com}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://mandemarket.soubadigital.com}
      - INTERNAL_API_URL=http://mandemarket-backend:4002
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-MandeMarket}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-2.1.0}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      mandemarket-backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001,mode=0770
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - traefik_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.mandemarket-frontend.rule=Host(`mandemarket.soubadigital.com`)
      - traefik.http.routers.mandemarket-frontend.entrypoints=websecure
      - traefik.http.routers.mandemarket-frontend.tls=true
      - traefik.http.routers.mandemarket-frontend.tls.certresolver=mytlschallenge
      - traefik.http.services.mandemarket-frontend.loadbalancer.server.port=3001

  # ===========================================================================
  # MandeMarket Database (PostgreSQL)
  # ===========================================================================
  mandemarket-db:
    image: postgres:16-alpine
    container_name: mandemarket-db
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${MANDEMARKET_DB_NAME:-mandemarket}
      - POSTGRES_USER=${MANDEMARKET_DB_USER}
      - POSTGRES_PASSWORD=${MANDEMARKET_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - mandemarket_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MANDEMARKET_DB_USER:-postgres} -d ${MANDEMARKET_DB_NAME:-mandemarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mandemarket_internal

  # ===========================================================================
  # MandeMarket Redis
  # ===========================================================================
  mandemarket-redis:
    image: redis:7-alpine
    container_name: mandemarket-redis
    env_file:
      - .env.production
    command: redis-server --requirepass ${MANDEMARKET_REDIS_PASSWORD} --appendonly yes
    volumes:
      - mandemarket_redis_data:/data
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MANDEMARKET_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mandemarket_internal

# =============================================================================
# Networks
# =============================================================================
networks:
  # Réseau externe partagé avec Traefik (reverse proxy)
  traefik_network:
    external: true
  # Réseau interne isolé pour la base de données et Redis
  mandemarket_internal:
    internal: true
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mandemarket_postgres_data:
    name: root_mandemarket_postgres_data
    external: true
  mandemarket_redis_data:
    name: root_mandemarket_redis_data
    external: true
  mandemarket_backend_uploads:
    name: root_mandemarket_backend_uploads
    external: true
  mandemarket_backend_logs:
    name: root_mandemarket_backend_logs
    external: true

