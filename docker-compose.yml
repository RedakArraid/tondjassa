# =============================================================================
# DOCKER COMPOSE - MandeMarket LOCAL
# =============================================================================
# Configuration locale sans Traefik ni volumes externes
# Utilisation:
#   - Démarrer:       docker compose up -d
#   - Démarrer+build: docker compose up -d --build
#   - Arrêter:        docker compose down
#   - Logs:           docker compose logs -f
#   - Reset complet:  docker compose down -v && docker compose up -d --build
#   - Statut:         docker compose ps
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL 16
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mandemarket-postgres
    environment:
      POSTGRES_DB: mandemarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mandemarket123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mandemarket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mandemarket_network

  # ===========================================================================
  # Redis 7
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: mandemarket-redis
    command: redis-server --requirepass redis123 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mandemarket_network

  # ===========================================================================
  # Mailpit - SMTP local sans relais externe + boîte de réception de test
  # ===========================================================================
  mailpit:
    image: axllent/mailpit:v1.26
    container_name: mandemarket-mailpit
    command:
      - --database
      - /data/mailpit.db
      - --smtp-auth-accept-any
      - --smtp-auth-allow-insecure
      - --max
      - "500"
    ports:
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mandemarket_network

  # ===========================================================================
  # Backend Express.js + Prisma
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandemarket-backend
    env_file:
      - ./backend/.env.docker
    environment: &backend-local-environment
      RUN_MIGRATIONS: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: mandemarket-local
      SMTP_PASS: mandemarket-local
      EMAIL_FROM: "MandeMarket local <noreply@mandemarket.test>"
      ADMIN_EMAIL: support@mandemarket.test
    ports:
      - "4002:4002"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - mandemarket_network

  # ===========================================================================
  # Worker - emails transactionnels, rapprochements et tâches différées
  # ===========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandemarket-worker
    command: ["node", "scripts/worker.js"]
    env_file:
      - ./backend/.env.docker
    environment:
      <<: *backend-local-environment
      RUN_MIGRATIONS: "false"
      SEED_DATA: "false"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');process.exit(Date.now()-Number(f.readFileSync('/app/tmp/worker-heartbeat','utf8'))<300000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - mandemarket_network

  # ===========================================================================
  # Frontend Next.js 14
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4002}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: mandemarket-frontend
    env_file:
      - ./frontend/.env.docker
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4002}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - INTERNAL_API_URL=http://backend:4002
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mandemarket_network

  # ===========================================================================
  # Adminer - Interface web pour PostgreSQL
  # ===========================================================================
  adminer:
    image: adminer:latest
    container_name: mandemarket-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mandemarket_network

# =============================================================================
# Networks
# =============================================================================
networks:
  mandemarket_network:
    driver: bridge

# =============================================================================
# Volumes (locaux, pas external)
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  mailpit_data:
