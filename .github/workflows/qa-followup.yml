name: Apply browser QA follow-up (temporary)
on:
  push:
    branches: [feature/production-hardening-20260925]
    paths: [.github/workflows/qa-followup.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/production-hardening-20260925
          fetch-depth: 2
      - name: Apply exact source replacements on the reviewed parent
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "49ae8e8f65f547617a5080f2f52e55112c5ebe04"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('backend/src/services/email.service.js')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '2ab617ce53fd09f1383e2a80a966bc4087d879bb7ab37b5b2e5a1226167b0ef3'
          s = p.read_text()
          marker = 'module.exports = {\n'
          assert s.count(marker) == 1
          fn = '''// Administrative notification never includes a guest access capability.
          async function sendNewOrderNotification(order) {
            const to = process.env.ADMIN_EMAIL;
            if (!to) return { success: false, error: 'ADMIN_EMAIL non configure' };
            const reference = escapeHtml(order.orderNumber || order.id);
            const amount = Math.round(order.totalAmount / 100).toLocaleString('fr-FR');
            const status = escapeHtml(STATUS_LABELS[order.status] || order.status);
            const dashboard = escapeHtml(`${process.env.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000'}/admin/dashboard`);
            const html = baseTemplate(`<h2>Nouvelle commande enregistree</h2>
              <p>Reference : <strong>${reference}</strong></p>
              <p>Montant : ${amount} FCFA. Statut : ${status}.</p>
              <p>La reception de cette commande ne constitue pas une preuve de paiement.</p>
              <p><a href="${dashboard}">Ouvrir l'administration</a></p>`);
            return sendEmail({ to, subject: `Nouvelle commande ${reference} - MandeMarket`, html });
          }

          '''
          s = s.replace(marker, fn + marker + '  sendNewOrderNotification,\n')
          s = s.replace('subject: `Commande #${safeOrderId} confirm\u00e9e - MandeMarket`', 'subject: `Commande #${safeOrderId} enregistree - MandeMarket`')
          p.write_text(s)
          p = Path('e2e/browser_acceptance.py')
          s = p.read_text()
          replacements = [
            ('''self.page.locator('form button[type="submit"]').first.click()''', 'self.page.get_by_role("button", name="Se connecter", exact=True).click()', 1),
            ('''self.page.locator('form button[type="submit"]').first.click()''', 'self.page.get_by_role("button", name="Cr\u00e9er mon compte", exact=True).click()', 1),
            ('''expect(self.page.locator('button[type="submit"]').last).to_be_enabled()''', 'expect(self.page.get_by_role("button", name="Confirmer la commande")).to_be_enabled()\n        expect(self.page.get_by_test_id("quote-total")).to_have_attribute("data-amount", "2200000")', 1),
            ('expect(self.page.get_by_role("alert")).to_contain_text("Livraison indisponible")', 'expect(self.page.locator("p[role=alert]")).to_contain_text("Livraison indisponible")', 1),
            ('self.page.goto(BASE + "/panier")\n        expect(self.page.get_by_text("Article recette QA", exact=True).first).to_be_visible()\n        self.page.reload()', 'self.page.goto(BASE + "/panier")\n        expect(self.page.get_by_text("Article recette QA", exact=True).first).to_be_visible()\n        self.page.wait_for_load_state("networkidle")\n        self.page.reload()', 1),
            ('self.page.on("pageerror", lambda error: self.errors.append(str(error)))', 'self.page.on("pageerror", lambda error: self.errors.append(str(error)))\n        self.page.on("response", lambda response: self.errors.append(f"HTTP {response.status} {response.url.split(chr(63))[0]}") if response.url.startswith(BASE + "/api/") and response.status >= 500 else None)', 1)
          ]
          for before, after, count in replacements:
              assert before in s, before
              s = s.replace(before, after, count)
          p.write_text(s)
          p = Path('.gitignore')
          p.write_text(p.read_text() + '\n# Isolated browser QA output (may contain test tokens)\nqa-results/\n__pycache__/\n*.pyc\n')
          p = Path('backend/src/__tests__/email-notification.test.js')
          assert not p.exists()
          p.write_text('''const nodemailer = require('nodemailer');
          jest.mock('nodemailer', () => ({ createTransport: jest.fn() }));
          jest.mock('../services/order-access.service', () => ({ createOrderToken: () => 'test-capability' }));
          const email = require('../services/email.service');
          const original = { ...process.env };
          const sendMail = jest.fn();
          beforeEach(() => {
            Object.assign(process.env, { NODE_ENV: 'production', SMTP_HOST: 'mail.test.invalid', SMTP_PORT: '587', SMTP_USER: 'test', SMTP_PASS: 'test-only', ADMIN_EMAIL: 'admin@test.invalid' });
            sendMail.mockReset().mockResolvedValue({ messageId: 'test-id' });
            nodemailer.createTransport.mockReturnValue({ sendMail });
          });
          afterAll(() => { process.env = original; });
          test('new-order notification is exported, delivered to configured admin and HTML escaped', async () => {
            const result = await email.sendNewOrderNotification({ id: 'test-order', orderNumber: '<img src=x>', totalAmount: 2400000, status: 'PENDING' });
            expect(result.success).toBe(true);
            const message = sendMail.mock.calls[0][0];
            expect(message.to).toBe('admin@test.invalid');
            expect(message.html).toContain('&lt;img src=x&gt;');
            expect(message.html).not.toContain('<img src=x>');
            expect(message.html).not.toContain('#token=');
            expect(nodemailer.createTransport).toHaveBeenCalledWith(expect.objectContaining({ requireTLS: true }));
          });
          test('unpaid order receipt does not announce a confirmed payment', async () => {
            await email.sendOrderConfirmation({ email: 'guest@test.invalid', firstName: 'QA' }, { id: 'test-order', totalAmount: 100000, status: 'PENDING', items: [] });
            expect(sendMail.mock.calls[0][0].subject).toContain('enregistree');
          });
          ''')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/services/email.service.js backend/src/__tests__/email-notification.test.js e2e/browser_acceptance.py .gitignore
          git commit -m 'fix(qa): restore admin order email and correct browser journey synchronization'
          git push origin HEAD:feature/production-hardening-20260925
