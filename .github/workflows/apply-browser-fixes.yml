name: Apply reviewed browser acceptance changes (temporary)
on:
  push:
    branches: [feature/production-hardening-20260925]
    paths: [.qa-transfer/acceptance.xz]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/production-hardening-20260925
          fetch-depth: 2
      - name: Apply only checksum-verified source changes
        env:
          EXPECTED_PARENT: 883299b2e7a7b9d527e8e0e1f34d6f33b9d51fc4
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd()
          packed = (root / '.qa-transfer/acceptance.xz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == 'd2195545e051805d1a561961cd8a4ac29a79a7ac7da32ea7cedacd6615e42091'
          changes = json.loads(lzma.decompress(packed))
          assert len(changes) == 8
          outputs = []
          seen = set()
          for change in changes:
              path = pathlib.PurePosixPath(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not str(path).startswith('.github/workflows/') and str(path) not in seen
              seen.add(str(path))
              target = root / path
              assert not target.is_symlink()
              before = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(before).hexdigest() == change['base'], 'Base mismatch: ' + str(path)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['ops']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == change['sha256'], 'Result mismatch: ' + str(path)
              outputs.append((target, after))
          for target, data in outputs:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          (root / '.qa-transfer/acceptance.xz').unlink()
          print('Verified and applied', len(outputs), 'source changes')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(acceptance): align checkout quotes and add isolated HTTPS browser journeys'
          git push origin HEAD:feature/production-hardening-20260925
