name: Browser acceptance (isolated preproduction)
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: HTTPS browser journeys and SMTP delivery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: tondjassa-browser-qa
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install pinned browser tools
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Build the actual production images for local HTTPS
        run: |
          docker build -t tondjassa-backend:ci backend
          docker build --build-arg NEXT_PUBLIC_API_URL=https://localhost:3443 --build-arg NEXT_PUBLIC_SITE_URL=https://localhost:3443 -t tondjassa-frontend:ci frontend
      - name: Start disposable HTTPS and authenticated STARTTLS environment
        run: |
          mkdir -p "$RUNNER_TEMP/qa-certs" qa-results
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout "$RUNNER_TEMP/qa-certs/key.pem" -out "$RUNNER_TEMP/qa-certs/cert.pem" -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,DNS:mailpit,IP:127.0.0.1' -addext 'basicConstraints=critical,CA:TRUE'
          chmod 755 "$RUNNER_TEMP/qa-certs"
          chmod 644 "$RUNNER_TEMP/qa-certs/"*.pem
          printf 'CI_JWT_SECRET=%s\nCI_METRICS_TOKEN=%s\nE2E_PASSWORD=%s\nQA_CERTS_DIR=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" "$RUNNER_TEMP/qa-certs" > "$RUNNER_TEMP/browser.env"
          chmod 600 "$RUNNER_TEMP/browser.env"
          docker compose --env-file "$RUNNER_TEMP/browser.env" -f .github/compose.smoke.yml -f .github/compose.browser.yml up -d --wait --wait-timeout 180
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --cacert "$RUNNER_TEMP/qa-certs/cert.pem" https://localhost:3443/ -o /dev/null
      - name: Seed fictitious data and execute browser journeys
        run: |
          set -a
          . "$RUNNER_TEMP/browser.env"
          set +a
          docker compose --env-file "$RUNNER_TEMP/browser.env" -f .github/compose.smoke.yml -f .github/compose.browser.yml exec -T -e E2E_FIXTURES=true -e E2E_PASSWORD="$E2E_PASSWORD" backend node e2e/seed.js
          python e2e/browser_acceptance.py
          QA_CERTS_DIR="$QA_CERTS_DIR" python e2e/http_concurrency_smoke.py
      - name: Diagnostics on failure (fictitious data only)
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/browser.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/browser.env" -f .github/compose.smoke.yml -f .github/compose.browser.yml logs --tail=100 > qa-results/containers.log 2>&1 || true
          fi
      - name: Preserve dated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.run_id }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only this isolated environment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/browser.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/browser.env" -f .github/compose.smoke.yml -f .github/compose.browser.yml down -v --remove-orphans
            rm -f "$RUNNER_TEMP/browser.env"
            rm -rf "$RUNNER_TEMP/qa-certs"
          fi
