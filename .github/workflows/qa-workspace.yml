name: Prepare browser QA workspace (temporary)
on:
  push:
    branches: [feature/production-hardening-20260925]
    paths: [.github/workflows/qa-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: git archive --format=tar.gz HEAD -o qa-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qa-source
          path: qa-source.tar.gz
          retention-days: 1
