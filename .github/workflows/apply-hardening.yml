name: Apply reviewed production hardening (temporary)
on:
  push:
    branches: [feature/production-hardening-20260925]
    paths: ['.github/workflows/apply-hardening.yml', '.hardening/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'RedakArraid/tondjassa' && github.ref == 'refs/heads/feature/production-hardening-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/production-hardening-20260925
          fetch-depth: 2
      - name: Verify base and apply hash-checked source changes
        env:
          EXPECTED_PARENT: db36bc14cb97abf367f0b77343ad655763cd7d60
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd()
          packed = b''.join((root / '.hardening' / ('part-%s.xz' % i)).read_bytes() for i in range(6))
          assert hashlib.sha256(packed).hexdigest() == 'ea96baeef922b5c3651d10e86f543784155d0f3c77889a6714fdb8adac15c6b4', 'Transfer checksum mismatch'
          changes = json.loads(lzma.decompress(packed))
          assert len(changes) == 90
          outputs = []
          seen = set()
          for change in changes:
              relative = pathlib.PurePosixPath(change['path'])
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert str(relative) not in seen
              seen.add(str(relative))
              target = root / relative
              assert not target.is_symlink()
              before = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(before).hexdigest() == change['base'], 'Base mismatch: ' + str(relative)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['ops']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == change['sha256'], 'Result mismatch: ' + str(relative)
              outputs.append((target, after))
          for target, data in outputs:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          shutil.rmtree(root / '.hardening')
          for name in ['hardening-workspace.yml', 'hardening-dependencies.yml', 'apply-hardening.yml']:
              (root / '.github/workflows' / name).unlink(missing_ok=True)
          print('Verified and applied', len(outputs), 'source changes; temporary transfer files removed.')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix(production): secure accounts, financial state and deployment validation"
          git push origin HEAD:feature/production-hardening-20260925
          git rev-parse HEAD
